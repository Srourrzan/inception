services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file: ./.env
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=$MYSQL_ROOT_PASSWORD", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 5


  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file: ./.env
    restart: unless-stopped
    volumes:
      - wp_data:/var/www/html
    ports:
      - "9000:9000"
    depends_on:
      mariadb:
        condition: service_healthy 

volumes:
  db_data:
  wp_data: